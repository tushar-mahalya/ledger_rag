[project]
name = "ledgerctl"
version = "0.1.0"
description = "Operator CLI: SOPS + age secrets, injection into local runs and delivery to runtimes"
requires-python = ">=3.11"
# Standard library only; Modal delivery uses the workspace `compute` group's SDK.
dependencies = []

[project.scripts]
ledgerctl = "ledgerctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerctl"]
