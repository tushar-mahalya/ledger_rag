log_format ledger_ui escape=json '{"service":"ledger-ui","method":"$request_method","status":$status,"seconds":$request_time,"request_id":"$request_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout ledger_ui;
    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location = /health {
        access_log off;
        return 200 "ready\n";
    }

    location /v1/ {
        proxy_pass http://engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
