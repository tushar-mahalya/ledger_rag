[project]
name = "ledger-rag"
version = "0.1.0"
description = "Ledger engine: evidence-first financial QA API shared by every channel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "structlog>=25,<27",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "qdrant-client>=1.13,<2",
  "langgraph>=1.0,<2",
  "mcp>=2.3,<3",
]

[dependency-groups]
# Embedding fine-tuning (ledger_rag.training); installed only in the Modal training image.
train = [
    "datasets>=3,<5",
    "sentence-transformers[onnx,train]>=5,<6",
    "torch>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_rag"]
