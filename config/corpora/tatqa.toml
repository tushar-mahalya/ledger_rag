# Corpus spec: python -m ledger_rag.corpus plan|build|status|promote|rollback tatqa
id = "tatqa"
description = "TAT-QA report tables and paragraphs (CC-BY-4.0), benchmark corpus"
tenant = "tatqa"

[source]
kind = "dataset"     # pinned, SHA-256-verified dataset registry
name = "tatqa"

[access]
# Groups for documents without an ACL; empty means visible to every reader of the tenant.
default_groups = []
classification = "public"

[processing]
chunk_profile = "v1"
metadata = ["dataset", "company", "fiscal_year"]

[embedding]
model = "Alibaba-NLP/gte-modernbert-base"
revision = "e7f32e3c00f91d699e8c43b53106206bcc72bb22"
dimensions = 768
quantization = "none"

[index]
# Serving alias; each build is the collection <alias>__<build_id>.
alias = "tatqa_gte_modernbert"
keep_builds = 2
