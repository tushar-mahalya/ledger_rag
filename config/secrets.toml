# Ledger secret manifest: every credential, where it is stored and who receives it.
#
# Values never live in this public repository. They are SOPS + age encrypted in the
# private store (default ~/.config/ledger/secrets) and managed with ledgerctl.
# See docs/SECRETS.md. A name here is public; a value is not.
#
#   deliver = { <target> = true }            same variable name
#   deliver = { <target> = "OTHER_NAME" }    renamed for that runtime
#   deliver = { <target> = ["A", "B"] }      several names for that runtime
#   envs     default: every environment
#   required default: true; generate = "hex32" creates 256-bit internal keys
#   value    a public constant routed like a secret but never stored in SOPS
version = 1

[environments.dev]
modal_environment = "dev"
cloudflare_env = "dev"

[environments.prod]
modal_environment = "prod"
cloudflare_env = "prod"

# operator: authenticates ledgerctl on your machine; never delivered to a runtime.
# local:    injected by `ledgerctl run` for local development.
# modal-*:  one Modal Secret each; apps read only the Secrets they attach.
[targets.operator]
platform = "operator"

[targets.local]
platform = "local"

[targets.modal-tei]
platform = "modal"
secret = "ledger-tei"

[targets.modal-database]
platform = "modal"
secret = "ledger-ingestion"

[targets.modal-llm]
platform = "modal"
secret = "ledger-llm"

[targets.modal-llm-serve]
platform = "modal"
secret = "ledger-llm-serve"

# The voice channel service (ADR 0006): speech, Twilio and engine-client credentials only.
[targets.modal-voice]
platform = "modal"
secret = "ledger-voice"

# --- Platform credentials (operator only) ---------------------------------------

[secrets.MODAL_TOKEN_ID]
description = "Modal API token id for the tushki10200 workspace (deploys, jobs, secret sync)"
deliver = { operator = true }

[secrets.MODAL_TOKEN_SECRET]
description = "Modal API token secret paired with MODAL_TOKEN_ID"
deliver = { operator = true }

[secrets.CLOUDFLARE_API_TOKEN]
description = "Cloudflare API token (Workers Scripts: Edit) for deployments and secret sync"
deliver = { operator = true }
required = false

[secrets.CLOUDFLARE_ACCOUNT_ID]
description = "Cloudflare account id used with CLOUDFLARE_API_TOKEN"
deliver = { operator = true }
required = false

# --- Generated internal credentials ---------------------------------------------

[secrets.LEDGER_DEMO_TOKEN]
description = "Local demo bearer token for the API, web workspace and local voice service (dev only)"
envs = ["dev"]
generate = "hex32"
deliver = { local = ["LEDGER_DEMO_TOKEN", "LEDGER_VOICE_ENGINE_TOKEN"] }

[secrets.LEDGER_TEI_API_KEY]
description = "Bearer key for the Modal embedding, reranker, verifier and decision endpoints"
generate = "hex32"
deliver = { modal-tei = "TEI_API_KEY", local = [
  "LEDGER_EMBEDDING_API_KEY",
  "LEDGER_RERANKER_API_KEY",
  "LEDGER_DECISION_API_KEY",
  "LEDGER_GROUNDEDNESS_VERIFIER_API_KEY",
] }

[secrets.LEDGER_QWEN_API_KEY]
description = "Bearer key for the self-hosted Qwen vLLM endpoint on Modal"
generate = "hex32"
deliver = { modal-llm-serve = "LEDGER_LLM_SERVE_API_KEY", local = true }

# --- Provider credentials -------------------------------------------------------

[secrets.LEDGER_GEMINI_API_KEY]
description = "Google AI Studio API key (Gemini, OpenAI-compatible endpoint)"
deliver = { local = "LEDGER_LLM_API_KEY", modal-llm = "LEDGER_LLM_API_KEY" }

[secrets.LEDGER_GEMINI_BASE_URL]
description = "Gemini OpenAI-compatible base URL used by Modal evaluation jobs"
value = "https://generativelanguage.googleapis.com/v1beta/openai"
deliver = { modal-llm = "LEDGER_LLM_BASE_URL" }

[secrets.LEDGER_QDRANT_URL]
description = "HTTPS URL of the Qdrant cluster"
deliver = { local = true, modal-database = true }

[secrets.LEDGER_QDRANT_API_KEY]
description = "Qdrant API key scoped to the Ledger collections"
deliver = { local = true, modal-database = true }

[secrets.LEDGER_FRED_API_KEY]
description = "FRED/ALFRED API key for external macro evidence"
required = false
deliver = { local = true }

[secrets.LEDGER_ELEVENLABS_API_KEY]
description = "ElevenLabs key restricted to speech-to-text and text-to-speech"
required = false
deliver = { local = "LEDGER_VOICE_ELEVENLABS_API_KEY", modal-voice = "LEDGER_VOICE_ELEVENLABS_API_KEY" }

[secrets.LEDGER_VOICE_STREAM_SECRET]
description = "HMAC key binding each Twilio media stream to its verified call"
generate = "hex32"
deliver = { local = true, modal-voice = true }

[secrets.TWILIO_ACCOUNT_SID]
description = "Twilio account SID (AC...) used for call hang-up"
required = false
deliver = { local = "LEDGER_VOICE_TWILIO_ACCOUNT_SID", modal-voice = "LEDGER_VOICE_TWILIO_ACCOUNT_SID" }

[secrets.TWILIO_AUTH_TOKEN]
description = "Twilio auth token: verifies X-Twilio-Signature and authorizes hang-up"
required = false
deliver = { local = "LEDGER_VOICE_TWILIO_AUTH_TOKEN", modal-voice = "LEDGER_VOICE_TWILIO_AUTH_TOKEN" }
