services:
  api:
    command: ["python", "/app/wait-for-secrets.py"]
    environment:
      LEDGER_ENVIRONMENT: production
      LEDGER_AUTH_MODE: oidc
      LEDGER_DEMO_TOKEN: null
      LEDGER_SEED_PATH: null
      LEDGER_OIDC_ISSUER: ${LEDGER_OIDC_ISSUER:?Set OIDC issuer}
      LEDGER_OIDC_AUDIENCE: ${LEDGER_OIDC_AUDIENCE:?Set OIDC audience}
      LEDGER_OIDC_JWKS_URL: ${LEDGER_OIDC_JWKS_URL:?Set HTTPS JWKS URL}
      LEDGER_PROVIDER: ${LEDGER_PROVIDER:?Set openai or anthropic}
      LEDGER_LLM_BASE_URL: ${LEDGER_LLM_BASE_URL:?Set HTTPS LLM URL}
      LEDGER_LLM_MODEL: ${LEDGER_LLM_MODEL:?Set model}
      LEDGER_EMBEDDING_BASE_URL: ${LEDGER_EMBEDDING_BASE_URL:?Set HTTPS embedding URL}
      LEDGER_EMBEDDING_MODEL: ${LEDGER_EMBEDDING_MODEL:?Set embedding model}
      LEDGER_EMBEDDING_DIMENSIONS: ${LEDGER_EMBEDDING_DIMENSIONS:-1536}
      LEDGER_RERANKER_URL: ${LEDGER_RERANKER_URL:-}
      LEDGER_RERANKER_TIMEOUT_SECONDS: ${LEDGER_RERANKER_TIMEOUT_SECONDS:-3}
      LEDGER_RETRIEVAL_BACKEND: qdrant
      LEDGER_QDRANT_URL: http://qdrant:6333
      LEDGER_SECRETS_DIR: /run/ledger-secrets
      LEDGER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: !override
      - ledger-secrets:/run/ledger-secrets:ro
    depends_on:
      vault-agent:
        condition: service_started
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started

  vault-agent:
    profiles: [production]
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    user: "10001:10001"
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/agent.hcl"]
    restart: unless-stopped
    volumes:
      - ./deploy/vault/agent.hcl:/vault/config/agent.hcl:ro
      - ./deploy/private/approle:/run/approle:ro
      - ./deploy/private/vault-tls/ca.crt:/run/vault-ca.crt:ro
      - ledger-secrets:/run/ledger-secrets
      - telemetry-secrets:/run/telemetry-secrets
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      vault:
        condition: service_healthy

  otel-collector:
    volumes: !override
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - telemetry-secrets:/run/telemetry-secrets:ro
    depends_on:
      vault-agent:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started

volumes:
  ledger-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=10001,gid=10001,mode=0700"
  telemetry-secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=10001,gid=10001,mode=0700"
