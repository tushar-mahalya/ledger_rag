services:
  web:
    profiles: [chat]
    build:
      context: ./web
    image: ledger-workspace:local
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:3001:8080"]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=101,gid=101,mode=0700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
