# Ledger monorepo: a virtual uv workspace. Each member is a self-contained unit with
# its own dependencies, sources and tests; this file holds only shared tooling.
# See README.md "Repository layout".

[tool.uv.workspace]
members = ["services/engine", "services/voice", "tools/ledgerctl"]

[dependency-groups]
compute = [
    "modal>=1.1,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Vendored upstream code stays byte-identical to its pinned source.
extend-exclude = ["services/engine/src/ledger_rag/evaluation/official/_finqa_upstream.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["ledger_rag", "ledger_voice", "ledgerctl", "compute", "scripts"]

[tool.mypy]
strict = true
packages = ["ledger_rag"]
mypy_path = "services/engine/src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Every unit keeps its tests beside its code.
testpaths = [
    "services/engine/tests",
    "services/voice/tests",
    "tools/ledgerctl/tests",
    "compute/tests",
    "scripts/tests",
]
# Repository root, so tests can import the compute/ and scripts/ packages.
pythonpath = ["."]
markers = [
    "live: calls real SEC EDGAR / FRED APIs; skipped unless LEDGER_LIVE_TESTS=1",
]
