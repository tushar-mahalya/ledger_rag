[project]
name = "ledger-rag"
version = "0.1.0"
description = "Evidence-first financial intelligence RAG backend for chat and voice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "structlog>=25,<27",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "qdrant-client>=1.13,<2",
  "langgraph>=1.0,<2",
  "mcp>=2.3,<3",
]

[dependency-groups]
compute = [
    "modal>=1.1,<2",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyyaml>=6,<7",
]
train = [
    "datasets>=3,<5",
    "sentence-transformers[onnx,train]>=5,<6",
    "torch>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ledger_rag"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: calls real SEC EDGAR / FRED APIs; skipped unless LEDGER_LIVE_TESTS=1",
]
